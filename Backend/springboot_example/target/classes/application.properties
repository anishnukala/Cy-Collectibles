server.port = 8080

# this lets you to view the database using localhost:8080/h2-console
spring.datasource.url=jdbc:mariadb://coms-3090-008.class.las.iastate.edu:3306/cycollectibles_db
spring.datasource.username=${DB_USERNAME:backend}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

#this enables print of sql commands sent to the database
spring.jpa.properties.hibernate.show_sql=true
 
#this sets the console to print all messages upto DEBUG level
logging.level.org=DEBUG


#this use actuator to show mappings using /actuator/mappings
management.endpoints.web.exposure.include=*
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui-custom.html
gemini.api.key=${GEMINI_API_KEY:}



